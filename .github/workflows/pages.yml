name: Deploy registry wiki to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify deploy password is configured
        env:
          REGISTRY_DEPLOY_PASSWORD: ${{ secrets.REGISTRY_DEPLOY_PASSWORD }}
        run: test -n "$REGISTRY_DEPLOY_PASSWORD" || (echo 'Missing REGISTRY_DEPLOY_PASSWORD repository secret' && exit 1)
      - name: Test
        run: go test ./...
      - name: Export static wiki
        env:
          REGISTRY_DEPLOY_PASSWORD: ${{ secrets.REGISTRY_DEPLOY_PASSWORD }}
        run: go run ./cmd/registry export --out public
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
